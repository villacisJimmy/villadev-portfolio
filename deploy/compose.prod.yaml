services:
  app:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}:${TAG}
    container_name: villadev-app
    restart: unless-stopped
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Next.js escribe el caché de optimización de next/image aquí. Con el
      # rootfs en read-only hay que darle un tmpfs efímero (un caché no
      # necesita persistir) y que sea escribible por el uid 1001 del runtime.
      - /app/.next/cache:size=128m,mode=0700,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    networks: [villadev_net]
    ports:
      - "127.0.0.1:3001:3000"
    env_file: /srv/villadev/.env
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
networks:
  villadev_net:
    driver: bridge
